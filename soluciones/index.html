<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="noindex,follow" name="robots"/><link href="https://www.goatify.app/ecosistema/" rel="canonical"/><meta content="0;url=/ecosistema/" http-equiv="refresh"/><title>Redirigiendo al Ecosistema Goatify</title><style id="goatify-vat-visibility-v42">html:not([data-goatify-vat-country="EC"]) .goatify-vat-label,html:not([data-goatify-vat-country="EC"]) .goatify-vat-note{display:none!important}</style></head><body>
<div aria-label="Selector de idioma Goatify" class="gfy-language-toggle-v33 notranslate" id="gfy-language-toggle-v33" translate="no">
<button aria-pressed="false" data-gfy-lang="es" translate="no" type="button">ES</button>
<button aria-pressed="false" data-gfy-lang="en" translate="no" type="button">EN</button>
</div>
<div aria-hidden="true" class="gfy-hidden-translate-v33" id="google_translate_element"></div>
<style id="gfy-language-toggle-style-v33">
  .gfy-language-toggle-v33{
    position:fixed!important;
    top:12px!important;
    right:12px!important;
    z-index:2147483000!important;
    display:inline-flex!important;
    align-items:center!important;
    gap:3px!important;
    padding:4px!important;
    border-radius:999px!important;
    background:rgba(15,23,42,.88)!important;
    border:1px solid rgba(255,255,255,.18)!important;
    box-shadow:0 14px 38px rgba(0,0,0,.22)!important;
    backdrop-filter:blur(14px)!important;
    -webkit-backdrop-filter:blur(14px)!important;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
  }
  .gfy-language-toggle-v33 button{
    appearance:none!important;
    border:0!important;
    cursor:pointer!important;
    border-radius:999px!important;
    padding:7px 10px!important;
    min-width:38px!important;
    line-height:1!important;
    font-size:12px!important;
    font-weight:900!important;
    letter-spacing:.04em!important;
    color:#e5e7eb!important;
    background:transparent!important;
    transition:transform .18s ease,background .18s ease,color .18s ease!important;
  }
  .gfy-language-toggle-v33 button:hover{transform:translateY(-1px)!important;background:rgba(255,255,255,.12)!important;}
  .gfy-language-toggle-v33 button.active{background:#fff!important;color:#111827!important;}
  .gfy-hidden-translate-v33{position:absolute!important;left:-9999px!important;top:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:0!important;pointer-events:none!important;}
  .goog-te-banner-frame.skiptranslate,
  iframe.goog-te-banner-frame,
  .goog-te-balloon-frame,
  #goog-gt-tt,
  .goog-tooltip,
  .goog-tooltip:hover{display:none!important;visibility:hidden!important;}
  body{top:0!important;}
  body > .skiptranslate{display:none!important;}
  @media(max-width:640px){
    .gfy-language-toggle-v33{top:6px!important;right:6px!important;padding:2px!important;opacity:.82!important;background:rgba(15,23,42,.68)!important;border-color:rgba(255,255,255,.12)!important;box-shadow:0 10px 24px rgba(0,0,0,.16)!important;}
    .gfy-language-toggle-v33 button{font-size:10px!important;min-width:30px!important;padding:5px 7px!important;}
  }

/* V34: hide old header language switch to avoid duplicate ES/EN selector */
.lang-switch{display:none!important}
</style>
<script id="gfy-language-toggle-script-v46">
(function(){
  'use strict';

  var htmlLang = (document.documentElement.getAttribute('lang') || '').toLowerCase();
  var path = (location.pathname || '').toLowerCase();
  var SOURCE_LANG = (htmlLang.indexOf('en') === 0 || path.indexOf('/en/') === 0 || path === '/en') ? 'en' : 'es';
  var TARGET_LANGS = ['es','en'];
  var COOKIE_DAYS = 365;
  var MANUAL_KEY = 'goatify_lang_manual_v45';
  var MANUAL_COOKIE = 'goatify_lang_manual_v45';
  var AUTO_KEY = 'goatify_lang_auto_v45';
  var COUNTRY_KEY = 'goatify_ip_country_v45';
  var LEGACY_MANUAL_KEYS = ['goatify_lang_manual_v37','goatify_lang_manual_v33','goatify_lang_manual_v9'];
  var LEGACY_GENERAL_KEY = 'goatify_lang_v7';

  var SPANISH_IP_COUNTRIES = {
    AR:1, BO:1, BR:1, BZ:1, CL:1, CO:1, CR:1, CU:1, DO:1, EC:1, ES:1,
    GT:1, HN:1, MX:1, NI:1, PA:1, PE:1, PR:1, PY:1, SV:1, UY:1, VE:1
  };

  function validLang(lang){ return TARGET_LANGS.indexOf(lang) >= 0 ? lang : null; }
  function sourceOr(lang){ return validLang(lang) || SOURCE_LANG; }
  function getStorage(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function setStorage(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }
  function removeStorage(key){ try{ localStorage.removeItem(key); }catch(e){} }

  function cookieDomain(){
    var host = String(location.hostname || '').toLowerCase();
    if(host === 'goatify.app' || /\.goatify\.app$/.test(host)) return '.goatify.app';
    return '';
  }

  function setCookie(name, value, domain){
    var expires = new Date(Date.now() + COOKIE_DAYS*24*60*60*1000).toUTCString();
    var cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
    if(location.protocol === 'https:') cookie += '; Secure';
    if(domain) cookie += '; domain=' + domain;
    document.cookie = cookie;
  }

  function clearCookie(name, domain){
    var cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax';
    if(location.protocol === 'https:') cookie += '; Secure';
    if(domain) cookie += '; domain=' + domain;
    document.cookie = cookie;
  }

  function readCookie(name){
    var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    if(!match) return null;
    try{ return decodeURIComponent(match[1]); }catch(e){ return match[1] || null; }
  }

  function persistManual(lang){
    lang = sourceOr(lang);
    setStorage(MANUAL_KEY, lang);
    setStorage('goatify_lang_manual_v37', lang);
    setStorage('goatify_lang_manual_v9', lang);
    setStorage(LEGACY_GENERAL_KEY, lang);
    setCookie(MANUAL_COOKIE, lang, cookieDomain());
    setCookie(MANUAL_COOKIE, lang, '');
  }

  function getManualLang(){
    var candidates = [getStorage(MANUAL_KEY), readCookie(MANUAL_COOKIE)];
    LEGACY_MANUAL_KEYS.forEach(function(key){ candidates.push(getStorage(key)); });
    for(var i=0;i<candidates.length;i++){
      var lang = validLang(candidates[i]);
      if(lang){ persistManual(lang); return lang; }
    }
    return null;
  }

  function googDomains(){
    var domains = [''];
    var root = cookieDomain();
    if(root) domains.push(root);
    return domains;
  }

  function clearGoogTrans(){
    googDomains().forEach(function(domain){ clearCookie('googtrans', domain); });
  }

  function setGoogTrans(lang){
    lang = sourceOr(lang);
    clearGoogTrans();
    if(lang === SOURCE_LANG) return;
    var value = '/' + SOURCE_LANG + '/' + lang;
    googDomains().forEach(function(domain){ setCookie('googtrans', value, domain); });
  }

  function mark(lang){
    lang = sourceOr(lang);
    document.documentElement.setAttribute('data-goatify-lang', lang);
    document.documentElement.setAttribute('data-goatify-source-lang', SOURCE_LANG);
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('#gfy-language-toggle-v33 [data-gfy-lang]').forEach(function(btn){
      var active = btn.getAttribute('data-gfy-lang') === lang;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.setAttribute('translate', 'no');
    });
  }

  function useGoogleCombo(lang){
    var combo = document.querySelector('.goog-te-combo');
    if(!combo) return false;
    lang = sourceOr(lang);
    var wanted = lang === SOURCE_LANG ? '' : lang;
    if(combo.value !== wanted) combo.value = wanted;
    try{ combo.dispatchEvent(new Event('change', {bubbles:true})); }
    catch(e){
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('change', true, false);
      combo.dispatchEvent(evt);
    }
    return true;
  }

  function applyLanguage(lang){
    lang = sourceOr(lang);
    mark(lang);
    setGoogTrans(lang);
    if(document.querySelector('.goog-te-combo')){
      useGoogleCombo(lang);
      setTimeout(function(){ useGoogleCombo(lang); mark(lang); }, 250);
      setTimeout(function(){ useGoogleCombo(lang); mark(lang); }, 900);
    }
  }

  function desiredLang(){
    var manual = getManualLang();
    if(manual) return manual;
    var cached = validLang(getStorage(AUTO_KEY));
    if(cached) return cached;
    return SOURCE_LANG;
  }

  function applyManualLang(lang){
    lang = sourceOr(lang);
    var current = validLang(document.documentElement.getAttribute('data-goatify-lang')) || desiredLang();
    persistManual(lang);
    removeStorage(AUTO_KEY);
    setGoogTrans(lang);
    mark(lang);
    if(current === lang){ applyLanguage(lang); return; }
    try{ sessionStorage.setItem('goatify_lang_scroll_v46', String(window.scrollY || 0)); }catch(e){}
    window.location.reload();
  }

  window.googleTranslateElementInit = function(){
    try{
      new google.translate.TranslateElement({
        pageLanguage: SOURCE_LANG,
        includedLanguages: 'es,en',
        autoDisplay: false,
        multilanguagePage: true
      }, 'google_translate_element');
      [120,420,1100,2200].forEach(function(delay){
        setTimeout(function(){ var lang = desiredLang(); useGoogleCombo(lang); mark(lang); }, delay);
      });
    }catch(e){}
  };

  function ensureGoogleScript(){
    if(document.getElementById('google-translate-api-v45')) return;
    var script = document.createElement('script');
    script.id = 'google-translate-api-v45';
    script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    script.async = true;
    document.head.appendChild(script);
  }

  function countryToLang(countryCode){
    var cc = String(countryCode || '').trim().toUpperCase();
    if(!cc) return SOURCE_LANG;
    return SPANISH_IP_COUNTRIES[cc] ? 'es' : 'en';
  }

  function fetchWithTimeout(url, ms){
    var controller = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if(controller) controller.abort(); }, ms || 2200);
    return fetch(url, {cache:'no-store', signal:controller ? controller.signal : undefined})
      .finally(function(){ clearTimeout(timer); });
  }

  function detectCountry(){
    return fetchWithTimeout('https://ipwho.is/?fields=success,country_code', 2200)
      .then(function(response){ if(!response.ok) throw new Error('ipwho'); return response.json(); })
      .then(function(data){ if(data && data.success !== false && data.country_code) return data.country_code; throw new Error('ipwho-empty'); })
      .catch(function(){
        return fetchWithTimeout('https://get.geojs.io/v1/ip/country.json', 2200)
          .then(function(response){ if(!response.ok) throw new Error('geojs'); return response.json(); })
          .then(function(data){ return data && (data.country || data.country_code || data.countryCode); });
      })
      .catch(function(){ return null; });
  }

  function applyAutomaticLanguageOnce(){
    if(getManualLang()) return;
    var cached = validLang(getStorage(AUTO_KEY));
    if(cached){ applyLanguage(cached); return; }
    if(SOURCE_LANG === 'en'){
      setStorage(AUTO_KEY, 'en');
      applyLanguage('en');
      return;
    }
    detectCountry().then(function(countryCode){
      if(getManualLang()) return;
      var lang = countryToLang(countryCode);
      setStorage(AUTO_KEY, lang);
      setStorage(COUNTRY_KEY, countryCode ? String(countryCode).toUpperCase() : 'UNKNOWN');
      setStorage(LEGACY_GENERAL_KEY, lang);
      applyLanguage(lang);
    });
  }

  function bindButtons(){
    document.querySelectorAll('#gfy-language-toggle-v33 [data-gfy-lang]').forEach(function(btn){
      if(btn.dataset.goatifyLanguageBoundV45 === '1') return;
      btn.dataset.goatifyLanguageBoundV45 = '1';
      btn.addEventListener('click', function(event){
        event.preventDefault();
        event.stopPropagation();
        applyManualLang(btn.getAttribute('data-gfy-lang') || SOURCE_LANG);
      });
    });
  }

  function restoreScrollAfterLanguageSwitch(){
    var y = null;
    try{ y = sessionStorage.getItem('goatify_lang_scroll_v46'); sessionStorage.removeItem('goatify_lang_scroll_v46'); }catch(e){}
    if(y === null) return;
    var top = Math.max(0, parseInt(y,10) || 0);
    [0,120,350,800].forEach(function(delay){ setTimeout(function(){ window.scrollTo(0, top); }, delay); });
  }

  function init(){
    var toggle = document.getElementById('gfy-language-toggle-v33');
    if(toggle){
      toggle.classList.add('notranslate');
      toggle.setAttribute('translate','no');
    }
    var holder = document.getElementById('google_translate_element');
    if(holder){ holder.classList.add('notranslate'); holder.setAttribute('translate','no'); }
    bindButtons();
    var initial = desiredLang();
    applyLanguage(initial);
    ensureGoogleScript();
    applyAutomaticLanguageOnce();
    restoreScrollAfterLanguageSwitch();
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true});
  else init();

  window.addEventListener('pageshow', function(){
    bindButtons();
    applyLanguage(desiredLang());
  });

  window.addEventListener('storage', function(event){
    if(event.key === MANUAL_KEY || LEGACY_MANUAL_KEYS.indexOf(event.key) >= 0){
      var manual = getManualLang();
      if(manual) applyLanguage(manual);
    }
  });
})();
</script>
