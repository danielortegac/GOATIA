<script id="gfy-language-toggle-script-v54">
(function(){
  'use strict';

  var htmlLang = (document.documentElement.getAttribute('lang') || '').toLowerCase();

  var SOURCE_LANG = (htmlLang.indexOf('en') === 0 || path.indexOf('/en/') === 0 || path === '/en') ? 'en' : 'es';

  var COOKIE_DAYS = 365;

  var MANUAL_COOKIE = 'goatify_lang_manual_v54';
  var AUTO_KEY = 'goatify_lang_auto_v54';

  var SCROLL_KEY = 'goatify_lang_scroll_v54';

  var LEGACY_GENERAL_KEY = 'goatify_lang_v7';
  var navigationStarted = false;
  var googleReady = false;
  var fallbackTimer = 0;

  var SPANISH_IP_COUNTRIES = {
    AR:1, BO:1, BR:1, BZ:1, CL:1, CO:1, CR:1, CU:1, DO:1, EC:1, ES:1,
    GT:1, HN:1, MX:1, NI:1, PA:1, PE:1, PR:1, PY:1, SV:1, UY:1, VE:1
  };

  function validLang(lang){
    lang = String(lang || '').toLowerCase();
    return TARGET_LANGS.indexOf(lang) >= 0 ? lang : null;
  }
  function getStorage(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function setStorage(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }
  function removeStorage(key){ try{ localStorage.removeItem(key); }catch(e){} }

  function hostDomains(){
    var host = String(location.hostname || '').toLowerCase();
    var list = [''];
    function add(value){ if(value && list.indexOf(value) < 0) list.push(value); }
    if(host){ add(host); add('.' + host.replace(/^\./,'')); }
    if(host === 'goatify.app' || /(^|\.)goatify\.app$/.test(host)){
      add('goatify.app');
      add('.goatify.app');
      add('www.goatify.app');
      add('.www.goatify.app');
    }
    return list;
  }

  function cookiePaths(){
    var list = ['/'];
    var current = String(location.pathname || '/');
    var dir = current.replace(/[^/]*$/, '');
    [dir, '/en/', '/es/'].forEach(function(value){ if(value && list.indexOf(value) < 0) list.push(value); });
    return list;

  function writeCookie(name, value, domain, pathValue, encode){
    var expires = new Date(Date.now() + COOKIE_DAYS*24*60*60*1000).toUTCString();
    var stored = encode === false ? String(value) : encodeURIComponent(String(value));
    var cookie = name + '=' + stored + '; expires=' + expires + '; path=' + (pathValue || '/') + '; SameSite=Lax';
    if(location.protocol === 'https:') cookie += '; Secure';
    if(domain) cookie += '; domain=' + domain;
    try{ document.cookie = cookie; }catch(e){}
  }

  function expireCookie(name, domain, pathValue){
    var cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=' + (pathValue || '/') + '; SameSite=Lax';
    if(location.protocol === 'https:') cookie += '; Secure';
    if(domain) cookie += '; domain=' + domain;
    try{ document.cookie = cookie; }catch(e){}
  }

  function readCookie(name){
    var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '=([^;]*)'));
    if(!match) return null;
    try{ return decodeURIComponent(match[1]); }catch(e){ return match[1] || null; }
  }

  function persistManual(lang){
    lang = validLang(lang) || SOURCE_LANG;
    setStorage(MANUAL_KEY, lang);
    LEGACY_MANUAL_KEYS.forEach(function(key){ setStorage(key, lang); });
    setStorage(LEGACY_GENERAL_KEY, lang);
    hostDomains().forEach(function(domain){ writeCookie(MANUAL_COOKIE, lang, domain, '/', true); });
  }

  function getManualLang(){
    var candidates = [getStorage(MANUAL_KEY), readCookie(MANUAL_COOKIE)];
    LEGACY_MANUAL_KEYS.forEach(function(key){ candidates.push(getStorage(key)); });
    for(var i=0;i<candidates.length;i++){

      if(lang){
        if(getStorage(MANUAL_KEY) !== lang) persistManual(lang);
        return lang;
      }
    }
    return null;
  }

  function clearGoogleCookies(){

    });

      document.cookie.split(';').forEach(function(part){
        var name = part.split('=')[0].trim();
        if(name === 'googtrans') expireCookie(name, '', '/');
      });
    }catch(e){}
  }

  function setGoogleCookie(lang){
    clearGoogleCookies();
    lang = validLang(lang) || SOURCE_LANG;
    if(lang === SOURCE_LANG) return;
    var value = '/' + SOURCE_LANG + '/' + lang;
    hostDomains().forEach(function(domain){ writeCookie('googtrans', value, domain, '/', false); });
  }

  function removeGoogleArtifacts(){
    clearGoogleCookies();
    try{
      document.documentElement.classList.remove('translated-ltr','translated-rtl');
      if(document.body){

  function mark(lang){

      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.setAttribute('translate', 'no');
    });

  function desiredLang(){
    return getManualLang() || validLang(getStorage(AUTO_KEY)) || SOURCE_LANG;
  }

  function cleanRefreshParam(){
    try{
      var url = new URL(location.href);
      if(!url.searchParams.has(REFRESH_PARAM)) return;
      url.searchParams.delete(REFRESH_PARAM);
      var clean = url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '') + url.hash;
      history.replaceState(history.state, document.title, clean);
    }catch(e){}
  }

  function rememberScroll(){
    try{ sessionStorage.setItem(SCROLL_KEY, String(window.scrollY || 0)); }catch(e){}
  }

  function restoreScroll(){
    var value = null;
    try{ value = sessionStorage.getItem(SCROLL_KEY); sessionStorage.removeItem(SCROLL_KEY); }catch(e){}
    if(value === null) return;
    var top = Math.max(0, parseInt(value,10) || 0);
    [0,120,420,900].forEach(function(delay){ setTimeout(function(){ window.scrollTo(0, top); }, delay); });
  }

  function hardReload(lang){
    if(navigationStarted) return;
    navigationStarted = true;
    rememberScroll();
    try{
      var url = new URL(location.href);
      url.searchParams.set(REFRESH_PARAM, (validLang(lang) || SOURCE_LANG) + '-' + Date.now());
      location.replace(url.pathname + '?' + url.searchParams.toString() + url.hash);
    }catch(e){ location.reload(); }
  }

  function nativeAlternate(lang){
    lang = validLang(lang) || SOURCE_LANG;
    var selectors = lang === 'en'
      ? ['link[rel~="alternate"][hreflang="en"]','link[rel~="alternate"][hreflang="en-US"]']
      : ['link[rel~="alternate"][hreflang="es-419"]','link[rel~="alternate"][hreflang="es"]'];
    var link = null;
    for(var i=0;i<selectors.length && !link;i++) link = document.querySelector(selectors[i]);
    var href = link && link.getAttribute('href');
    if(!href && /\/soluciones\/?$/i.test(location.pathname || '')) href = lang === 'en' ? '/en/ecosystem/' : '/ecosistema/';
    if(!href) return null;
    try{
      var target = new URL(href, location.href);
      target.protocol = location.protocol;
      target.host = location.host;
      if(!target.search && location.search){
        var current = new URLSearchParams(location.search);
        current.delete(REFRESH_PARAM);
        target.search = current.toString() ? '?' + current.toString() : '';
      }
      if(!target.hash && location.hash) target.hash = location.hash;
      return target.pathname + target.search + target.hash;
    }catch(e){ return href; }
  }

  function goNativeFallback(lang){
    if(navigationStarted) return;
    var target = nativeAlternate(lang);
    if(!target) return;
    var currentPath = String(location.pathname || '/').replace(/\/+$/,'') || '/';
    var targetPath = String(target).split(/[?#]/)[0].replace(/\/+$/,'') || '/';
    if(currentPath === targetPath) return;
    navigationStarted = true;
    rememberScroll();
    location.replace(target);
  }

  function useGoogleCombo(lang){
    var combo = document.querySelector('.goog-te-combo');
    if(!combo) return false;
    var wanted = lang === SOURCE_LANG ? '' : lang;
    if(combo.value !== wanted) combo.value = wanted;
    try{ combo.dispatchEvent(new Event('change', {bubbles:true})); }
    catch(e){
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('change', true, false);
      combo.dispatchEvent(evt);
    }
    return true;
  }

  function translationAppearsActive(lang){
    if(lang === SOURCE_LANG) return true;
    var combo = document.querySelector('.goog-te-combo');
    var classActive = document.documentElement.classList.contains('translated-ltr') ||
      document.documentElement.classList.contains('translated-rtl') ||
      (document.body && (document.body.classList.contains('translated-ltr') || document.body.classList.contains('translated-rtl')));
    return !!(combo && combo.value === lang && classActive);
  }

  function scheduleTranslationFallback(lang){
    clearTimeout(fallbackTimer);
    fallbackTimer = setTimeout(function(){
      if(!translationAppearsActive(lang)) goNativeFallback(lang);
    }, 10000);
  }

  window.googleTranslateElementInit = function(){
    try{
      new google.translate.TranslateElement({
        pageLanguage: SOURCE_LANG,
        includedLanguages: 'es,en',
        autoDisplay: false,
        multilanguagePage: true
      }, 'google_translate_element');
      googleReady = true;
      var lang = desiredLang();
      [80,300,900,1800,3500].forEach(function(delay){
        setTimeout(function(){ useGoogleCombo(lang); mark(lang); }, delay);
      });
      scheduleTranslationFallback(lang);
    }catch(e){
      goNativeFallback(desiredLang());

  };

  function ensureGoogleScript(lang){
    if(lang === SOURCE_LANG) return;
    var existing = document.getElementById('google-translate-api-v54');
    if(existing){ scheduleTranslationFallback(lang); return; }
    var script = document.createElement('script');
    script.id = 'google-translate-api-v54';
    script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    script.async = true;
    script.onerror = function(){ goNativeFallback(lang); };
    document.head.appendChild(script);
    scheduleTranslationFallback(lang);
  }

  function applyLanguage(lang){
    lang = validLang(lang) || SOURCE_LANG;
    mark(lang);
    if(lang === SOURCE_LANG){
      removeGoogleArtifacts();
      return;
    }
    setGoogleCookie(lang);
    ensureGoogleScript(lang);
    if(googleReady){
      useGoogleCombo(lang);
      scheduleTranslationFallback(lang);
    }
  }

  function applyManualLang(lang){
    lang = validLang(lang) || SOURCE_LANG;
    persistManual(lang);

    clearTimeout(fallbackTimer);
    if(lang === SOURCE_LANG) removeGoogleArtifacts();
    else setGoogleCookie(lang);
    mark(lang);

  }

  function bindButtons(){

      if(!btn || !toggle.contains(btn)) return;

      event.stopPropagation();

  function fetchWithTimeout(url, ms){
    var controller = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if(controller) controller.abort(); }, ms || 2500);
    return fetch(url, {cache:'no-store', signal:controller ? controller.signal : undefined})
      .finally(function(){ clearTimeout(timer); });
  }

  function detectCountry(){
    return fetchWithTimeout('https://ipwho.is/?fields=success,country_code', 2500)
      .then(function(response){ if(!response.ok) throw new Error('ipwho'); return response.json(); })
      .then(function(data){ if(data && data.success !== false && data.country_code) return data.country_code; throw new Error('ipwho-empty'); })
      .catch(function(){
        return fetchWithTimeout('https://get.geojs.io/v1/ip/country.json', 2500)
          .then(function(response){ if(!response.ok) throw new Error('geojs'); return response.json(); })
          .then(function(data){ return data && (data.country || data.country_code || data.countryCode); });
      })
      .catch(function(){ return null; });
  }

  function countryToLang(countryCode){
    var cc = String(countryCode || '').trim().toUpperCase();
    if(!cc) return SOURCE_LANG;
    return SPANISH_IP_COUNTRIES[cc] ? 'es' : 'en';
  }

  function applyAutomaticLanguageOnce(){
    if(getManualLang()) return;
    var cached = validLang(getStorage(AUTO_KEY));
    if(cached){ applyLanguage(cached); return; }
    detectCountry().then(function(countryCode){
      if(getManualLang() || navigationStarted) return;
      var lang = countryToLang(countryCode);
      setStorage(AUTO_KEY, lang);
      setStorage(COUNTRY_KEY, countryCode ? String(countryCode).toUpperCase() : 'UNKNOWN');
      setStorage(LEGACY_GENERAL_KEY, lang);
      if(lang === SOURCE_LANG) applyLanguage(lang);
      else{
        setGoogleCookie(lang);
        mark(lang);
        hardReload(lang);
      }
    });
  }

  function init(){
    cleanRefreshParam();
    bindButtons();
    var holder = document.getElementById('google_translate_element');
    if(holder){ holder.classList.add('notranslate'); holder.setAttribute('translate','no'); }
    var initial = desiredLang();
    applyLanguage(initial);
    applyAutomaticLanguageOnce();
    restoreScroll();

  window.addEventListener('pageshow', function(event){
    bindButtons();
    var lang = desiredLang();

      (document.documentElement.classList.contains('translated-ltr') || (document.body && document.body.classList.contains('translated-ltr')))){
      hardReload(lang);

  window.addEventListener('storage', function(event){
    if(event.key === MANUAL_KEY || LEGACY_MANUAL_KEYS.indexOf(event.key) >= 0){
      var lang = getManualLang();
      if(lang) hardReload(lang);
    }
  });
})();
