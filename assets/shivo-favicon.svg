<svg class="goatify-light-loader__walk" viewBox="84.275 35.375 138 138" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<style>/* The card shows just the mascot, with no loader ground or surrounding effects. */
.goatify-light-loader__walk > path,
.goatify-light-loader__walk-goat-shadow,
.goatify-light-loader__walk-trail,
.goatify-light-loader__walk-spark {
    display: none;
}

.goatify-light-loader__walk-goat-body {
    transform-origin: 150px 90px;
    animation: goatify-artifact-shivo-bob 1.1s ease-in-out infinite;
}

.goatify-light-loader__walk-near-leg,
.goatify-light-loader__walk-far-leg {
    transform-box: fill-box;
    transform-origin: 50% 4%;
    animation: goatify-artifact-shivo-step 1.1s ease-in-out infinite;
}

.goatify-light-loader__walk-leg-opposite {
    animation-delay: -.55s;
}

.goatify-light-loader__walk-far-leg {
    opacity: .66;
}

.goatify-light-loader__walk-goat-tail {
    transform-origin: 93px 91px;
    animation: goatify-artifact-shivo-tail 2.8s ease-in-out infinite;
}

@keyframes goatify-artifact-shivo-step {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(15deg); }
}

@keyframes goatify-artifact-shivo-bob {
    0%, 50%, 100% { transform: translateY(0); }
    25%, 75% { transform: translateY(-3px); }
}

@keyframes goatify-artifact-shivo-tail {
    0%, 75%, 100% { transform: rotate(0deg); }
    83% { transform: rotate(-9deg); }
    91% { transform: rotate(7deg); }
}

@media (prefers-reduced-motion: reduce) {
    .goatify-light-loader__walk * {
        animation: none !important;
    }
}
</style>
